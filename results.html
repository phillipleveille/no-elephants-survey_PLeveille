<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>No Elephants — Results Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --navy:#044192;
    --ice:#E8EEF7;
    --red:#C0100A;
    --charcoal:#3B3B3D;
    --amber:#B56A14;
    --white:#FFFFFF;
    --font-head:Cambria, Georgia, 'Times New Roman', serif;
    --font-body:Calibri, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--ice);
    color:var(--charcoal);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  #app{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    width:100%;
    min-height:100dvh;
    position:relative;
  }

  /* header */
  .topbar{
    background:var(--navy);
    color:var(--white);
    padding:18px 20px 16px;
    position:relative;
    flex-shrink:0;
  }
  .topbar h1{
    font-family:var(--font-head);
    font-size:1.15rem;
    letter-spacing:.04em;
    margin:0;
    font-weight:700;
    cursor:pointer;
    user-select:none;
  }
  .topbar .tagline{
    font-size:.68rem;
    letter-spacing:.14em;
    opacity:.85;
    margin-top:2px;
  }
  .hidden-hit{
    position:absolute;
    top:0; right:0;
    width:56px; height:56px;
    /* invisible tap target */
  }

  /* progress */
  .progress-wrap{
    display:flex;
    gap:6px;
    padding:14px 20px 0;
    flex-shrink:0;
  }
  .progress-dot{
    flex:1;
    height:5px;
    border-radius:3px;
    background:rgba(4,65,146,.15);
    overflow:hidden;
  }
  .progress-dot.done, .progress-dot.active{background:var(--navy);}
  .progress-dot.active{background:var(--amber);}

  /* main content */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:28px 22px 12px;
  }
  .eyebrow{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.12em;
    color:var(--amber);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h2.question{
    font-family:var(--font-head);
    font-size:1.5rem;
    line-height:1.3;
    color:var(--navy);
    margin:0 0 22px;
  }
  .subtext{
    font-size:.85rem;
    color:var(--charcoal);
    opacity:.75;
    margin:-14px 0 20px;
  }

  /* sliders */
  .slider-block{margin-bottom:26px;}
  .slider-label{
    display:flex;
    justify-content:space-between;
    font-size:.9rem;
    font-weight:700;
    color:var(--navy);
    margin-bottom:6px;
  }
  .slider-value{color:var(--amber);}
  input[type=range]{
    width:100%;
    height:6px;
    border-radius:3px;
    background:linear-gradient(90deg,var(--navy),var(--navy));
    -webkit-appearance:none;
    accent-color:var(--navy);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:26px;height:26px;border-radius:50%;
    background:var(--white);
    border:3px solid var(--navy);
    cursor:pointer;
    margin-top:-1px;
  }
  .slider-scale{
    display:flex; justify-content:space-between;
    font-size:.65rem; opacity:.55; margin-top:4px;
  }

  /* choice list */
  .choice{
    display:block;
    width:100%;
    text-align:left;
    background:var(--white);
    border:2px solid transparent;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    font-family:var(--font-body);
    font-size:1rem;
    color:var(--charcoal);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .choice.selected{
    border-color:var(--navy);
    background:#DCE6F5;
    color:var(--navy);
    font-weight:700;
  }
  .choice .check{
    float:right;
    opacity:0;
    color:var(--navy);
  }
  .choice.selected .check{opacity:1;}

  textarea, input[type=text]{
    width:100%;
    border:2px solid #C9D6E8;
    border-radius:12px;
    padding:14px;
    font-family:var(--font-body);
    font-size:1rem;
    resize:none;
    background:var(--white);
    color:var(--charcoal);
  }
  textarea:focus, input[type=text]:focus{outline:none; border-color:var(--navy);}

  /* nav */
  .nav{
    display:flex;
    gap:12px;
    padding:14px 20px 26px;
    flex-shrink:0;
  }
  button.btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:1rem;
    border:none;
    border-radius:12px;
    padding:15px 18px;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--navy);
    color:var(--white);
    flex:1;
  }
  .btn-primary:disabled{
    background:#9BAFCB;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--navy);
    border:2px solid var(--navy);
    flex:0 0 auto;
    width:80px;
  }

  /* thank you */
  .center-msg{
    text-align:center;
    padding:40px 10px;
  }
  .thankyou-logo{
    width:140px;
    height:140px;
    border-radius:50%;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(4,65,146,.18);
  }
  .center-msg h2{
    font-family:var(--font-head);
    color:var(--navy);
    font-size:1.6rem;
  }
  .center-msg p{
    color:var(--charcoal);
    opacity:.8;
    font-size:.95rem;
  }
  .results-link{
    position:fixed;
    bottom:10px;
    left:14px;
    font-size:.7rem;
    color:#9BAFCB;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
  }

  /* passcode */
  .gate-box{
    max-width:280px;
    margin:60px auto 0;
    text-align:center;
  }
  .gate-box input{
    text-align:center;
    letter-spacing:.3em;
    font-size:1.4rem;
  }
  .gate-error{color:var(--red); font-size:.8rem; margin-top:10px; min-height:1em;}

  /* results */
  .results-wrap{padding:20px 20px 60px;}
  .results-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:4px;
  }
  .results-header h2{
    font-family:var(--font-head); color:var(--navy); margin:0; font-size:1.3rem;
  }
  .results-count{font-size:.8rem; color:var(--amber); font-weight:700;}
  .tab-bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .tab-btn{
    background:var(--white);
    border:2px solid #C9D6E8;
    color:var(--navy);
    border-radius:20px;
    padding:8px 14px;
    font-size:.8rem;
    font-weight:700;
    font-family:var(--font-body);
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--white);
  }
  .refresh-btn{
    background:none;border:1px solid var(--navy); color:var(--navy);
    border-radius:8px; padding:6px 12px; font-size:.75rem; cursor:pointer;
    margin-bottom:18px;
  }
  .panel{
    background:var(--white);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:16px;
  }
  .panel h3{
    font-family:var(--font-head);
    color:var(--navy);
    font-size:1rem;
    margin:0 0 12px;
  }
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{
    display:flex; justify-content:space-between;
    font-size:.82rem; margin-bottom:3px;
  }
  .bar-track{
    background:var(--ice);
    border-radius:6px;
    height:14px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--navy);
    border-radius:6px;
  }
  .bar-fill.amber{background:var(--amber);}
  .bar-fill.red{background:var(--red);}
  .avg-number{
    font-family:var(--font-head);
    font-size:2.2rem;
    color:var(--navy);
    text-align:center;
  }
  .avg-sub{text-align:center; font-size:.75rem; opacity:.6; margin-top:-4px;}
  .result-slider-track{
    position:relative;
    height:34px;
    background:var(--ice);
    border-radius:8px;
    margin:6px 0 2px;
  }
  .result-slider-dot{
    position:absolute;
    top:50%;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--navy);
    opacity:.32;
    transform:translate(-50%,-50%);
  }
  .result-slider-avg{
    position:absolute;
    top:50%;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--white);
    border:4px solid var(--amber);
    box-shadow:0 1px 4px rgba(0,0,0,.28);
    transform:translate(-50%,-50%);
  }
  .word-cloud{
    display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;
    justify-content:center; padding:26px 4px;
  }
  .word-cloud span{
    font-family:var(--font-head);
    color:var(--navy);
  }
  .empty-note{font-size:.85rem; opacity:.6; text-align:center; padding:20px 0;}
  .reset-danger{
    display:block; margin:24px auto 0; background:var(--red); color:#fff;
    border:none; border-radius:10px; padding:10px 16px; font-size:.8rem;
    cursor:pointer;
  }
  .confirm-overlay{
    position:fixed; inset:0;
    background:rgba(59,59,61,.55);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    z-index:999;
  }
  .confirm-box{
    background:var(--white);
    border-radius:14px;
    padding:22px;
    max-width:320px;
    width:100%;
    text-align:center;
  }
  .confirm-box p{
    font-size:.95rem;
    margin:0 0 16px;
    color:var(--charcoal);
  }
  .confirm-buttons{
    display:flex;
    gap:10px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:var(--white);
    padding:10px 20px;
    border-radius:20px;
    font-size:.85rem;
    font-weight:700;
    z-index:1000;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
  }
</style>
</head>

  function uid(){
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
  }

  function ensureHiddenFrame(){
    let frame = document.getElementById('hiddenSubmitFrame');
    if(!frame){
      frame = document.createElement('iframe');
      frame.name = 'hiddenSubmitFrame';
      frame.id = 'hiddenSubmitFrame';
      frame.style.display = 'none';
      document.body.appendChild(frame);
    }
    return frame;
  }

  function submitToGoogleForm(fields){
    // The published artifact's Content-Security-Policy blocks fetch/XHR to
    // any third-party domain. A native <form> POST is a page navigation,
    // not a network call in the CSP sense, so it isn't blocked. We submit
    // into a hidden iframe so the person never sees or leaves the page.
    return new Promise((resolve) => {
      ensureHiddenFrame();
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = GOOGLE_FORM_ACTION;
      form.target = 'hiddenSubmitFrame';
      form.style.display = 'none';

      const fieldsMap = {
        [FORM_FIELDS.boundaryProf]: String(fields.boundaryProf),
        [FORM_FIELDS.boundaryPersonal]: String(fields.boundaryPersonal),
        [FORM_FIELDS.dread]: fields.dread || "",
        [FORM_FIELDS.whoWith]: (fields.whoWith || []).join(", "),
        [FORM_FIELDS.managerConfidence]: fields.managerConfidence || "",
        [FORM_FIELDS.avoidTopic]: fields.avoidTopic || ""
      };
      Object.keys(fieldsMap).forEach(key => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = fieldsMap[key];
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
      // Cross-origin iframe load can't be read for success/failure, so we
      // treat submission as delivered after a short delay — the same
      // "assume delivered" tradeoff the earlier no-cors fetch made, just
      // via navigation instead of a blocked network call.
      setTimeout(() => {
        if(form.parentNode){ form.parentNode.removeChild(form); }
        resolve();
      }, 700);
    });
  }

  async function submitResponse(){
    const payload = {
      boundaryProf: state.boundaryProf,
      boundaryPersonal: state.boundaryPersonal,
      dread: state.dread,
      whoWith: state.whoWith,
      avoidTopic: (state.avoidTopic || "").trim(),
      managerConfidence: state.managerConfidence
    };
    setState({submitting:true, submitError:""});
    try{
      await submitToGoogleForm(payload);
      setState({submitting:false, submitError:"", screen:"thankyou"});
    }catch(e){
      console.error("Failed to save response", e);
      setState({submitting:false, submitError:"Couldn't save your response. Check your connection and try again."});
    }
  }

  async function fetchAllResponses(){
    if(!SHEET_CSV_URL) return [];
    try{
      const res = await fetch(SHEET_CSV_URL);
      if(!res.ok) return [];
      const text = await res.text();
      const parsed = Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        transformHeader: h => h.trim()
      });
      return (parsed.data || []).map(row => ({
        boundaryProf: Number(row["Boundary - Professional"]) || 0,
        boundaryPersonal: Number(row["Boundary - Personal"]) || 0,
        dread: (row["Dread frequency"] || "").trim(),
        whoWith: (row["Hardest conversations with"] || "").split(",").map(s=>s.trim()).filter(Boolean),
        managerConfidence: (row["Manager confidence"] || "").trim(),
        avoidTopic: (row["Elephant in the room"] || "").trim()
      }));
    }catch(e){
      console.error("Failed to fetch sheet CSV", e);
      return [];
    }
  }

  async function loadResults(){
    setState({resultsLoading:true});
    const responses = await fetchAllResponses();
    setState({resultsData: responses, resultsLoading:false});
  }

  async function addTestWords(){
    const raw = state.testWordsText || "";
    const items = raw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    if(items.length === 0) return;
    for(const word of items){
      const payload = {
        boundaryProf: Math.floor(Math.random()*101),
        boundaryPersonal: Math.floor(Math.random()*101),
        dread: DREAD_OPTIONS[Math.floor(Math.random()*DREAD_OPTIONS.length)],
        whoWith: [WHO_OPTIONS[Math.floor(Math.random()*WHO_OPTIONS.length)]],
        avoidTopic: word,
        managerConfidence: MANAGER_OPTIONS[Math.floor(Math.random()*MANAGER_OPTIONS.length)]
      };
      try{
        await submitToGoogleForm(payload);
      }catch(e){ console.error("Failed to add test word", e); }
    }
    setState({testWordsText: ""});
    await loadResults();
  }

  async function clearAllData(){
    // Data now lives in Phillip's own Google Sheet. Deleting rows requires
    // Google authentication, which this public, no-login page intentionally
    // doesn't have — so instead of failing silently, tell him plainly where
    // to clear it himself.
    setState({
      clearMessage: "Open your linked Google Sheet and delete the response rows there — this app can't clear them from here."
    });
    setTimeout(()=>{ setState({clearMessage:""}); }, 4500);
  }

  function handleCornerTap(){
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>{ tapCount = 0; }, 2500);
    if(tapCount >= 5){
      tapCount = 0;
      setState({confirmingClear:true});
    }
  }

  function handleTitleTap(){
    titleTapCount++;
    clearTimeout(titleTapTimer);
    titleTapTimer = setTimeout(()=>{ titleTapCount = 0; }, 2000);
    if(titleTapCount >= 3){
      titleTapCount = 0;
      __survey.goto('gate');
    }
  }

  function progressDots(activeIndex){
    let html = '<div class="progress-wrap">';
    for(let i=0;i<QUESTIONS_COUNT;i++){
      let cls = "progress-dot";
      if(i < activeIndex) cls += " done";
      else if(i === activeIndex) cls += " active";
      html += `<div class="${cls}"></div>`;
    }
    html += '</div>';
    return html;
  }

  function topbar(){
    return `
      <div class="topbar">
        <div class="hidden-hit" onclick="__survey.tapCorner()"></div>
        <h1 onclick="__survey.tapTitle()">No Elephants</h1>
        <div class="tagline">CLEAR · OPEN · PROFESSIONAL · COMMUNICATION</div>
      </div>
    `;
  }

  function navButtons(opts){
    const showBack = opts.showBack;
    const nextLabel = opts.nextLabel || "Next";
    const nextDisabled = opts.nextDisabled;
    return `
      <div class="nav">
        ${showBack ? `<button class="btn btn-ghost" onclick="__survey.back()">Back</button>` : ""}
        <button class="btn btn-primary" id="nextBtn" ${nextDisabled?"disabled":""} onclick="__survey.next()">${nextLabel}</button>
      </div>
    `;
  }

  function screenQ1(){
    return `
      ${topbar()}
      ${progressDots(0)}
      <main>
        <div class="eyebrow">Question 1 of 5</div>
        <h2 class="question">How good are you at setting boundaries... and actually keeping them?</h2>
        <div class="slider-block">
          <div class="slider-label"><span>Professional life</span><span class="slider-value" id="val-boundaryProf">${state.boundaryProf}</span></div>
          <input type="range" min="0" max="100" step="1" value="${state.boundaryProf}"
            oninput="__survey.silentSlider('boundaryProf', this.value)" />
          <div class="slider-scale"><span>Boundaries? What boundaries?</span><span>I am the example.</span></div>
        </div>
        <div class="slider-block">
          <div class="slider-label"><span>Personal life</span><span class="slider-value" id="val-boundaryPersonal">${state.boundaryPersonal}</span></div>
          <input type="range" min="0" max="100" step="1" value="${state.boundaryPersonal}"
            oninput="__survey.silentSlider('boundaryPersonal', this.value)" />
          <div class="slider-scale"><span>Boundaries? What boundaries?</span><span>I am the example.</span></div>
        </div>
      </main>
      ${navButtons({showBack:false})}
    `;
  }

  function screenQ2(){
    return `
      ${topbar()}
      ${progressDots(1)}
      <main>
        <div class="eyebrow">Question 2 of 5</div>
        <h2 class="question">Have you ever "lost sleep" dreading an upcoming conversation?</h2>
        ${DREAD_OPTIONS.map(opt => `
          <button class="choice ${state.dread===opt?'selected':''}" onclick="__survey.update({dread:'${opt}'})">
            ${opt} <span class="check">✓</span>
          </button>
        `).join("")}
      </main>
      ${navButtons({showBack:true, nextDisabled: !state.dread})}
    `;
  }

  function screenQ3(){
    return `
      ${topbar()}
      ${progressDots(2)}
      <main>
        <div class="eyebrow">Question 3 of 5</div>
        <h2 class="question">Who are the hardest conversations with?</h2>
        <div class="subtext">Select all that apply.</div>
        ${WHO_OPTIONS.map(opt => `
          <button class="choice ${state.whoWith.includes(opt)?'selected':''}" onclick="__survey.toggleWho('${opt.replace(/'/g,"\\'")}')">
            ${opt} <span class="check">✓</span>
          </button>
        `).join("")}
      </main>
      ${navButtons({showBack:true, nextDisabled: state.whoWith.length===0})}
    `;
  }

  function screenQ4(){
    return `
      ${topbar()}
      ${progressDots(4)}
      <main>
        <div class="eyebrow">Question 5 of 5</div>
        <h2 class="question">What's the elephant in your room?</h2>
        <div class="subtext">What conversation topic do you avoid?</div>
        <input type="text" id="avoidTopicInput" maxlength="30" placeholder="Type a word or short phrase"
          value="${state.avoidTopic.replace(/"/g,'&quot;')}"
          oninput="__survey.silentText('avoidTopic', this.value)" />
        ${state.submitError ? `<div class="gate-error" style="text-align:left;margin-top:12px;">${state.submitError}</div>` : ""}
      </main>
      ${navButtons({showBack:true, nextLabel: state.submitting ? "Saving..." : "Submit", nextDisabled: !state.avoidTopic.trim() || state.submitting})}
    `;
  }

  function screenQ5(){
    return `
      ${topbar()}
      ${progressDots(3)}
      <main>
        <div class="eyebrow">Question 4 of 5</div>
        <h2 class="question">How confident are you that your manager would have a hard conversation with you if needed?</h2>
        ${MANAGER_OPTIONS.map(opt => `
          <button class="choice ${state.managerConfidence===opt?'selected':''}" onclick="__survey.update({managerConfidence:'${opt.replace(/'/g,"\\'")}'})">
            ${opt} <span class="check">✓</span>
          </button>
        `).join("")}
      </main>
      ${navButtons({showBack:true, nextDisabled: !state.managerConfidence})}
    `;
  }

  function screenThankyou(){
    return `
      ${topbar()}
      <main>
        <div class="center-msg">
          <img src="${LOGO_DATA_URI}" alt="No Elephants logo" class="thankyou-logo" />
          <h2>Thank you.</h2>
          <p>Your response has been added. No elephants in this room.</p>
        </div>
      </main>
    `;
  }

  function screenGate(){
    return `
      ${topbar()}
      <main>
        <div class="gate-box">
          <div class="eyebrow" style="text-align:center">Presenter access</div>
          <input type="text" id="gateInputEl" inputmode="numeric" maxlength="4" placeholder="••••"
            value="${state.gateInput}"
            oninput="__survey.silentGate(this.value)" />
          <div class="gate-error" id="gateErrorText">${state.gateError}</div>
          <div class="nav" style="padding:20px 0 0;">
            <button class="btn btn-ghost" onclick="__survey.goto('q1')">Back</button>
            <button class="btn btn-primary" onclick="__survey.checkGate()">Enter</button>
          </div>
        </div>
      </main>
    `;
  }

  function pct(n, total){
    if(!total) return 0;
    return Math.round((n/total)*100);
  }

  function screenResults(){
    if(state.resultsLoading){
      return `${topbar()}<main><div class="empty-note">Loading responses…</div></main>`;
    }
    const data = state.resultsData || [];
    const total = data.length;

    const TABS = [
      {key:"all", label:"All"},
      {key:"boundaries", label:"Boundaries"},
      {key:"dread", label:"Dread"},
      {key:"who", label:"Hardest With"},
      {key:"manager", label:"Manager"},
      {key:"words", label:"Word Cloud"}
    ];

    let panels = {};
    if(total === 0){
      panels = {
        boundaries:`<div class="empty-note">No responses yet.</div>`,
        dread:`<div class="empty-note">No responses yet.</div>`,
        who:`<div class="empty-note">No responses yet.</div>`,
        manager:`<div class="empty-note">No responses yet.</div>`,
        words:`<div class="empty-note">No responses yet.</div>`
      };
    }else{
      const avgProf = Math.round(data.reduce((s,r)=>s+(r.boundaryProf||0),0)/total);
      const avgPersonal = Math.round(data.reduce((s,r)=>s+(r.boundaryPersonal||0),0)/total);

      const dreadCounts = {};
      DREAD_OPTIONS.forEach(o=>dreadCounts[o]=0);
      data.forEach(r=>{ if(r.dread && dreadCounts.hasOwnProperty(r.dread)) dreadCounts[r.dread]++; });

      const whoCounts = {};
      WHO_OPTIONS.forEach(o=>whoCounts[o]=0);
      data.forEach(r=>{ (r.whoWith||[]).forEach(w=>{ if(whoCounts.hasOwnProperty(w)) whoCounts[w]++; }); });

      const mgrCounts = {};
      MANAGER_OPTIONS.forEach(o=>mgrCounts[o]=0);
      data.forEach(r=>{ if(r.managerConfidence && mgrCounts.hasOwnProperty(r.managerConfidence)) mgrCounts[r.managerConfidence]++; });

      const wordFreq = {};
      data.forEach(r=>{
        const t = (r.avoidTopic||"").toLowerCase().trim();
        if(t) wordFreq[t] = (wordFreq[t]||0)+1;
      });
      const words = Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]).slice(0,25);
      const maxWordCount = words.length ? words[0][1] : 1;

      const profValues = data.map(r=>r.boundaryProf).filter(v=>typeof v==="number");
      const personalValues = data.map(r=>r.boundaryPersonal).filter(v=>typeof v==="number");

      function sliderResultHTML(label, values, avg){
        const dots = values.map(v => `<div class="result-slider-dot" style="left:${v}%"></div>`).join("");
        return `
          <div class="slider-block">
            <div class="slider-label"><span>${label}</span><span class="slider-value">${avg}</span></div>
            <div class="result-slider-track">
              ${dots}
              <div class="result-slider-avg" style="left:${avg}%"></div>
            </div>
            <div class="slider-scale"><span>Boundaries? What boundaries?</span><span>I am the example.</span></div>
          </div>`;
      }

      panels.boundaries = `
        <div class="panel">
          <h3>Boundaries: setting and keeping them (avg of ${total})</h3>
          ${sliderResultHTML("Professional life", profValues, avgProf)}
          ${sliderResultHTML("Personal life", personalValues, avgPersonal)}
        </div>`;

      panels.dread = `
        <div class="panel">
          <h3>Lost sleep dreading a conversation</h3>
          ${DREAD_OPTIONS.map(o=>`
            <div class="bar-row">
              <div class="bar-label"><span>${o}</span><span>${dreadCounts[o]}</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct(dreadCounts[o],total)}%"></div></div>
            </div>
          `).join("")}
        </div>`;

      panels.who = `
        <div class="panel">
          <h3>Who the hardest conversations are with</h3>
          ${WHO_OPTIONS.map(o=>`
            <div class="bar-row">
              <div class="bar-label"><span>${o}</span><span>${whoCounts[o]}</span></div>
              <div class="bar-track"><div class="bar-fill amber" style="width:${pct(whoCounts[o],total)}%"></div></div>
            </div>
          `).join("")}
        </div>`;

      panels.manager = `
        <div class="panel">
          <h3>Confidence their manager would have a hard conversation if needed</h3>
          ${MANAGER_OPTIONS.map(o=>`
            <div class="bar-row">
              <div class="bar-label"><span>${o}</span><span>${mgrCounts[o]}</span></div>
              <div class="bar-track"><div class="bar-fill red" style="width:${pct(mgrCounts[o],total)}%"></div></div>
            </div>
          `).join("")}
        </div>`;

      panels.words = `
        <div class="panel">
          <h3>What's the elephant in your room?</h3>
          ${words.length ? `
            <div class="word-cloud">
              ${words.map(([w,c], i)=>{
                const palette = ['var(--navy)','var(--red)','var(--amber)','var(--charcoal)'];
                const color = palette[i % palette.length];
                const size = 0.9 + (c/maxWordCount)*2.3;
                const weight = c === maxWordCount ? 800 : 600;
                let hash = 0;
                for(let k=0;k<w.length;k++){ hash = (hash*31 + w.charCodeAt(k)) & 0xffffffff; }
                const absHash = Math.abs(hash);
                const offset = (absHash % 25) - 12;
                const isVertical = (absHash % 3 === 0) && w.length <= 14;
                const orientation = isVertical
                  ? "writing-mode:vertical-rl;text-orientation:mixed;"
                  : "";
                return `<span style="font-size:${size}rem;color:${color};font-weight:${weight};transform:translateY(${offset}px);display:inline-block;${orientation}">${w.replace(/</g,"&lt;")}</span>`;
              }).join("")}
            </div>
          ` : `<div class="empty-note">No entries yet.</div>`}
        </div>`;
    }

    const activeTab = state.resultsView || "all";
    const panelOrder = ["boundaries","dread","who","manager","words"];
    const body = activeTab === "all"
      ? panelOrder.map(k => panels[k]).join("")
      : (panels[activeTab] || "");

    return `
      ${topbar()}
      <div class="results-wrap">
        <div class="results-header">
          <h2>Live results</h2>
          <div class="results-count">${total} response${total===1?"":"s"}</div>
        </div>
        <button class="refresh-btn" onclick="__survey.loadResults()">Refresh</button>

        <div class="tab-bar">
          ${TABS.map(t => `
            <button class="tab-btn ${activeTab===t.key?'active':''}" onclick="__survey.setResultsTab('${t.key}')">${t.label}</button>
          `).join("")}
        </div>

        ${body}

        <div class="panel">
          <h3>Quick-add test entries</h3>
          <div class="subtext" style="margin:-4px 0 10px;">Comma or line separated words — each becomes a full test response so you don't have to retake the survey.</div>
          <textarea id="testWordsInput" rows="3" placeholder="pay, feedback, timing, trust"
            oninput="__survey.silentText('testWordsText', this.value)">${state.testWordsText || ""}</textarea>
          <button class="btn btn-primary" style="margin-top:10px;width:100%;" onclick="__survey.addTestWords()">Add test entries</button>
        </div>

        <button class="reset-danger" onclick="__survey.tapCorner(true)">Clear all data</button>
      </div>
    `;
  }

  function render(){
    let html;
    switch(state.screen){
      case "q1": html = screenQ1(); break;
      case "q2": html = screenQ2(); break;
      case "q3": html = screenQ3(); break;
      case "q4": html = screenQ4(); break;
      case "q5": html = screenQ5(); break;
      case "thankyou": html = screenThankyou(); break;
      case "gate": html = screenGate(); break;
      case "results": html = screenResults(); break;
      default: html = screenQ1();
    }
    if(state.confirmingClear){
      html += `
        <div class="confirm-overlay">
          <div class="confirm-box">
            <p>Clear all survey data? This cannot be undone.</p>
            <div class="confirm-buttons">
              <button class="btn btn-ghost" style="width:auto;flex:1;" onclick="__survey.cancelClear()">Cancel</button>
              <button class="btn btn-primary" style="flex:1;background:var(--red);" onclick="__survey.confirmClear()">Clear it</button>
            </div>
          </div>
        </div>`;
    }
    if(state.clearMessage){
      html += `<div class="toast">${state.clearMessage}</div>`;
    }
    document.getElementById("app").innerHTML = html;
  }

  const order = ["q1","q2","q3","q5","q4"];

  window.__survey = {
    update(patch){ setState(patch); },
    silentSlider(key, value){
      const v = parseInt(value, 10);
      state[key] = v;
      const el = document.getElementById('val-' + key);
      if(el) el.textContent = v;
    },
    silentText(key, value){
      state[key] = value;
      const btn = document.getElementById('nextBtn');
      if(btn) btn.disabled = !value.trim();
    },
    silentGate(value){
      const filtered = value.replace(/[^0-9]/g,'').slice(0,4);
      state.gateInput = filtered;
      state.gateError = "";
      const input = document.getElementById('gateInputEl');
      if(input && input.value !== filtered) input.value = filtered;
      const err = document.getElementById('gateErrorText');
      if(err) err.textContent = "";
    },
    toggleWho(opt){
      const set = new Set(state.whoWith);
      if(set.has(opt)) set.delete(opt); else set.add(opt);
      setState({whoWith: Array.from(set)});
    },
    next(){
      const idx = order.indexOf(state.screen);
      if(idx === -1) return;
      if(idx === order.length - 1){
        submitResponse();
      }else{
        setState({screen: order[idx+1]});
      }
    },
    back(){
      const idx = order.indexOf(state.screen);
      if(idx > 0) setState({screen: order[idx-1]});
    },
    goto(screen){
      if(screen === "gate"){
        setState({screen:"gate", gateInput:"", gateError:""});
      }else if(screen === "results"){
        setState({screen:"results", resultsView:"all"});
        loadResults();
      }else{
        setState({screen});
      }
    },
    checkGate(){
      if(state.gateInput === RESULTS_PASSCODE){
        __survey.goto("results");
      }else{
        setState({gateError:"Incorrect code."});
      }
    },
    loadResults(){ loadResults(); },
    setResultsTab(tab){ setState({resultsView: tab}); },
    addTestWords(){ addTestWords(); },
    tapTitle(){ handleTitleTap(); },
    tapCorner(force){
      if(force){
        setState({confirmingClear:true});
        return;
      }
      handleCornerTap();
    },
    cancelClear(){ setState({confirmingClear:false}); },
    async confirmClear(){
      setState({confirmingClear:false});
      await clearAllData();
      setState({clearMessage:"Survey data cleared."});
      setTimeout(()=>{ setState({clearMessage:""}); }, 2500);
    }
  };

  render();
})();
</script>
</body>
</html>
